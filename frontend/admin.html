<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/icons/icon-silver-192.png?v=11">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
  <title>Administração • IEPP Curitiba</title>
</head>
<body>
  <header class="admin-topbar">
    <a href="index.html#home" class="admin-brand"><img src="assets/images/logo igreja.png" alt=""><span><strong>IEPP Curitiba</strong><small>Painel administrativo</small></span></a>
    <div class="admin-top-actions"><span id="adminUser" class="admin-user"></span><button id="logoutButton" class="btn light small" hidden>Sair</button></div>
  </header>

  <main class="admin-main">
    <section id="setupView" class="admin-center" hidden>
      <div class="admin-auth-card">
        <img src="assets/images/logo igreja.png" alt="Logo IEPP Curitiba">
        <h1>Supabase ainda não configurado</h1>
        <p>Configure <code>PUBLIC_SUPABASE_URL</code> e <code>PUBLIC_SUPABASE_ANON_KEY</code> e execute o SQL do backend.</p>
        <a class="btn" href="README.admin.md">Abrir instruções</a>
      </div>
    </section>

    <section id="loginView" class="admin-center" hidden>
      <form id="loginForm" class="admin-auth-card">
        <img src="assets/images/logo igreja.png" alt="Logo IEPP Curitiba">
        <h1>Área administrativa</h1>
        <p>Entre com um usuário cujo perfil tenha a função <strong>admin</strong>.</p>
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn orange" type="submit">Entrar</button>
        <p id="loginError" class="admin-error" aria-live="polite"></p>
      </form>
    </section>

    <section id="dashboardView" class="admin-dashboard" hidden>
      <aside class="admin-sidebar">
        <button class="admin-tab active" data-admin-tab="overview">▦ Visão geral</button>
        <button class="admin-tab" data-admin-tab="posts">▤ Publicações</button>
        <button class="admin-tab" data-admin-tab="events">▣ Eventos</button>
        <button class="admin-tab" data-admin-tab="prayers">♡ Pedidos de oração</button>
        <a href="index.html#home">← Voltar ao PWA</a>
      </aside>
      <section id="adminContent" class="admin-content"></section>
    </section>
  </main>

  <div id="adminToast" class="toast" role="status"></div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
